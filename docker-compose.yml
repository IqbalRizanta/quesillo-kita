services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-quesillo}
      POSTGRES_PASSWORD: ${DB_PASS:-quesillo123}
      POSTGRES_DB: ${DB_NAME:-quesillo_db}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-quesillo}:${DB_PASS:-quesillo123}@db:5432/${DB_NAME:-quesillo_db}?schema=public
      PORT: 3000
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
