server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Kompresi — JS/CSS jadi ~3x lebih kecil saat transfer
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

  # Cache asset ber-hash selamanya (nama file berubah tiap build)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback — semua route diarahkan ke index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
