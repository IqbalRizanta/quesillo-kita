server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Kompresi — JS/CSS jadi ~3x lebih kecil saat transfer
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

  # Cache asset ber-hash selamanya (nama file berubah tiap build)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html jangan di-cache agar browser selalu memuat asset terbaru setelah update/build
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
  }

  # SPA fallback — semua route diarahkan ke index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }
}
